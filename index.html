<script>
  const audio = document.getElementById('audio');
  const foto = document.getElementById('fotoSecreta');

  audio.addEventListener('volumechange', function() {

    if (volumen === 67) {
      foto.style.display = 'block';
    } else {
      foto.style.display = 'none';
    }
  });
</script>
